name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Package deploy artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          tar -czf weather_server_artifact.tar.gz dist package.json package-lock.json

      - name: Upload deploy artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: weather-server-artifact
          path: weather_server_artifact.tar.gz
          retention-days: 14
